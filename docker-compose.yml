version: "3.9"
services:
  postgres:
    container_name: task-tracker-db
    image: postgres:15.6
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - task-tracker-net
    restart: always

  keycloak-ru:
    container_name: keycloak-ru
    image: playaru/keycloak-russian:24.0.1.2
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1024m -Djava.net.preferIPv4Stack=true"
    depends_on:
      - postgres
    ports:
      - "${KEYCLOAK_PORT}:8080"
    networks:
      - task-tracker-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend-react:
    build:
      context: ./frontend-react
      dockerfile: ./Dockerfile
    container_name: frontend-react
    ports:
      - "${FRONTEND_PORT}:80"
    restart: always
    networks:
      - task-tracker-net

  eureka-server:
    build:
      context: .
      dockerfile: ./packs/eureka_server/Dockerfile
      args:
        JAR_FILE: ./packs/eureka_server/EurekaServer.jar
    container_name: eureka-server
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=eureka-server
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    ports:
      - "${EUREKA_PORT}:8761"
    restart: always
    networks:
      - task-tracker-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  api-gateway:
    build:
      context: .
      dockerfile: ./packs/api_gateway/Dockerfile
      args:
        JAR_FILE: ./packs/api_gateway/apiGateway.hotfix-v1.1.jar
    container_name: api-gateway
    ports:
      - "${API_PORT}:8760"
    restart: always
    networks:
      - task-tracker-net
    environment:
      - SERVER_PORT=8760
      - SPRING_APPLICATION_NAME=API-GATEWAY
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=${HOST_IP}
      - EUREKA_INSTANCE_NON_SECURE_PORT=${API_PORT}
      - EUREKA_INSTANCE_INSTANCE_ID=${HOST_IP}:api-gateway:${API_PORT}
      - APP_ENV_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS}
      - APP_ENV_GATEWAY_SECRET=${GATEWAY_SECRET}
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID=true
      # ВАЖНО: Отключаем автоматический discovery locator
      # Он создает роуты с внутренними Docker hostnames
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=false
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8760/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  
  task-service:
    build:
      context: .
      dockerfile: ./packs/task_service/Dockerfile
      args:
        JAR_FILE: ./packs/task_service/taskTracker.hotfix-v1.1.jar
    container_name: task-service
    ports: 
      - "${TASK_PORT}:8081"
    restart: always
    networks:
      - task-tracker-net
    environment:
      - SERVER_PORT=8081
      - SPRING_APPLICATION_NAME=TASKSERVICE
      # Eureka
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=${HOST_IP}
      - EUREKA_INSTANCE_NON_SECURE_PORT=${TASK_PORT}
      - EUREKA_INSTANCE_INSTANCE_ID=${HOST_IP}:task-service:${TASK_PORT}
      - APP_ENV_ALLOWED_ORIGINS=${SERVICE_ALLOWED_ORIGINS}
      - APP_ENV_GATEWAY_SECRET=${GATEWAY_SECRET}
      - SPRING_DATASOURCE_URL=${TASK_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/task-db}
      - SPRING_DATASOURCE_USERNAME=${TASK_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${TASK_DATASOURCE_PASSWORD:-postgres}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL:-false}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: .
      dockerfile: ./packs/user_service/Dockerfile
      args:
        JAR_FILE: ./packs/user_service/authService.v1.jar
    container_name: user-service
    ports: 
      - "${USER_PORT}:8082"
    restart: always
    networks:
      - task-tracker-net
    environment:
      - SERVER_PORT=8082
      - SPRING_APPLICATION_NAME=USERSERVICE
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - APP_ENV_FRONT_PAGE=${FRONT_PAGE}
      - APP_ENV_ALLOWED_ORIGINS=${SERVICE_ALLOWED_ORIGINS}
      # Eureka
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_DEFAULTZONE}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=${HOST_IP}
      - EUREKA_INSTANCE_NON_SECURE_PORT=${USER_PORT}
      - EUREKA_INSTANCE_INSTANCE_ID=${HOST_IP}:user-service:${USER_PORT}
      # Keycloak 
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-task_tracker}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI=${KEYCLOAK_REDIRECT_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE=${KEYCLOAK_PROVIDER_USER_NAME_ATTRIBUTE:-preferred_username}
      - KEYCLOAK_AUTH_SERVER_URL=http://${HOST_IP}:${KEYCLOAK_PORT}
      - KEYCLOAK_REALM=master
      - KEYCLOAK_RESOURCE=admin-cli
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak-ru:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  task-tracker-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local